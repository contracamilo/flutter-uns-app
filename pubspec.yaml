## ============================================================
## FILE: pubspec.yaml
## PURPOSE: Project manifest - defines your app's identity, dependencies, and assets.
##
## CONCEPTS TAUGHT:
##   - 'name': Must match the Dart package name (lowercase_with_underscores).
##   - 'publish_to: none': Prevents accidental publication to pub.dev.
##   - 'environment.sdk': Constrains the Dart SDK version using semantic versioning.
##     '^3.9.0' means ">=3.9.0 and <4.0.0".
##   - 'dependencies': Packages your app needs at runtime.
##   - 'dev_dependencies': Packages only needed during development (testing, linting).
##   - Version syntax: '^1.0.0' means "compatible with 1.0.0" (>=1.0.0 <2.0.0).
##     This follows semantic versioning (semver): major.minor.patch
## ============================================================

name: unisalle
description: A learning-focused e-commerce Flutter boilerplate with heavy documentation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # STATE MANAGEMENT: Riverpod wraps your entire app in a ProviderScope,
  # giving any widget access to shared state without passing it down manually.
  # We use flutter_riverpod (not riverpod alone) because it provides
  # ConsumerWidget and other Flutter-specific integrations.
  flutter_riverpod: ^2.6.1

  # NAVIGATION: GoRouter provides declarative, URL-based routing.
  # This means routes are defined as data (a list of GoRoute objects),
  # not imperatively (Navigator.push). This is essential for web (URL bar)
  # and deep linking on mobile.
  go_router: ^14.8.1

  # FORMATTING: The intl package provides number/currency/date formatting
  # that respects locale. We use it for price display (e.g., "$79.99").
  intl: ^0.20.2

  # TYPOGRAPHY: Google Fonts lets you use any font from fonts.google.com
  # without downloading font files. It fetches them at runtime (and caches).
  google_fonts: ^6.2.1

  # iOS-style icons (included by default in Flutter projects)
  cupertino_icons: ^1.0.8

  # ICONS: Font Awesome provides brand icons (Google, GitHub, etc.)
  # and thousands of other icons not available in Material Icons.
  # Use FaIcon(FontAwesomeIcons.google) instead of Icon(Icons...).
  font_awesome_flutter: ^10.7.0

  # AUTH — GOOGLE SIGN-IN:
  # Official Google Sign-In plugin. Handles the OAuth 2.0 flow,
  # token retrieval, and account selection UI natively on each platform.
  # Requires GoogleService-Info.plist (iOS) and google-services.json (Android).
  # See docs/AUTH_SETUP.md §1 for full setup instructions.
  google_sign_in: ^6.2.2

  # AUTH — GITHUB OAUTH (and any other OAuth provider):
  # Opens a secure in-app browser (ASWebAuthenticationSession on iOS,
  # Chrome Custom Tabs on Android) for the OAuth flow and captures
  # the callback URL automatically. Used for GitHub's Authorization Code flow.
  # See docs/AUTH_SETUP.md §2 for full setup instructions.
  flutter_web_auth_2: ^4.0.0

  # FIREBASE CORE: Requerido para inicializar Firebase en la app.
  # Se inicializa en main.dart con Firebase.initializeApp().
  # firebase_options.dart es generado por: flutterfire configure
  firebase_core: ^4.4.0

  # FIREBASE AUTH: Autenticación con email/contraseña (y otros proveedores).
  # Requiere habilitar Email/Password en Firebase Console → Authentication.
  firebase_auth: ^6.1.4

  # RXDART: Extensiones reactivas para Dart Streams.
  # Provee BehaviorSubject y Rx.combineLatest para el patrón BLoC puro.
  # Usado en ProfileFormBloc para validaciones reactivas en tiempo real.
  rxdart: ^0.28.0

  # HTTP CLIENT: Dio se usa para hablar con el backend Node.js
  # (registro, login y subida de imagen de perfil). Ofrece interceptors
  # para inyectar el JWT automáticamente en cada request.
  dio: ^5.7.0

  # SECURE STORAGE: Persiste el JWT del backend entre reinicios.
  # En iOS usa Keychain; en Android, EncryptedSharedPreferences.
  flutter_secure_storage: ^9.2.2

  # IMAGE PICKER: Permite al usuario elegir una foto de la galería
  # o tomar una con la cámara para actualizar su avatar.
  image_picker: ^1.1.2

  # BLoC: Gestión de estado para el módulo de autenticación bajo
  # Clean Architecture. La presentación de auth depende de flutter_bloc
  # mientras que el resto del proyecto sigue en Riverpod.
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # EQUATABLE: Igualdad por valor para Entities, Events y States del
  # módulo de auth, evitando boilerplate de == y hashCode.
  equatable: ^2.0.5

  # DARTZ: Either<Failure, Success> para los UseCases del dominio,
  # de forma que los errores no atraviesen capas como excepciones.
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # MOCK ADAPTER PARA DIO: Permite interceptar requests HTTP en tests
  # unitarios y devolver respuestas controladas, sin necesidad de
  # levantar el backend.
  http_mock_adapter: ^0.6.1

  # Linting rules that enforce Dart/Flutter best practices.
  # These catch common mistakes at compile time before they become bugs.
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
